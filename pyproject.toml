[project]
name = "hexlock-password-manager"
version = "0.7.0"
description = "Local open-source password manager"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "@hexm1sery"}]
dependencies = ["cryptography>=43,<47", "argon2-cffi>=23.1,<26", "pywebview>=5,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.scripts]
hexlock = "app_launcher:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "native_host*"]

[tool.setuptools]
py-modules = ["app_launcher"]

[tool.setuptools.package-data]
app = ["ui/*"]
